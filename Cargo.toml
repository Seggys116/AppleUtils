[workspace]
members = ["crates/apple-tui"]
default-members = [".", "crates/apple-tui"]
resolver = "3"

[package]
name = "apple-utils"
version = "0.1.0"
edition = "2024"
authors = ["Zak Noble-Clarke"]
description = "Terminal toolkit for Apple device recovery and APFS work"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
apple-tui = { path = "crates/apple-tui" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
plist = "1.9.0"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4.46"
lzfse_rust = "0.2.1"
