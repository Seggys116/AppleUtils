name: Release

# Pushing a tag such as v0.1.0 builds Linux and macOS binaries and publishes
# them to a GitHub release. The macOS binary is signed with a Developer ID
# Application certificate and notarized. Linux binaries are unsigned.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: apple-utils

jobs:
  check-tag:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with Cargo.toml version
        run: |
          crate_version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=${tag_version} crate=${crate_version}"
          if [ "${crate_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p "${BIN}"

      - name: Package
        run: |
          name="${BIN}-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp "target/release/${BIN}" LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS universal (signed and notarized)
    needs: check-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release --locked -p "${BIN}" --target aarch64-apple-darwin
          cargo build --release --locked -p "${BIN}" --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            "target/aarch64-apple-darwin/release/${BIN}" \
            "target/x86_64-apple-darwin/release/${BIN}" \
            -output "dist/${BIN}"
          lipo -info "dist/${BIN}"

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="${RUNNER_TEMP}/release-signing.keychain-db"
          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${MACOS_KEYCHAIN_PASSWORD}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db

          identity="$(security find-identity -v -p codesigning "${keychain}" \
            | grep 'Developer ID Application' \
            | grep "(${APPLE_TEAM_ID})" \
            | head -n 1 \
            | awk '{print $2}')"
          if [ -z "${identity}" ]; then
            echo "::error::No Developer ID Application identity for team ${APPLE_TEAM_ID} in the imported certificate"
            exit 1
          fi
          echo "SIGNING_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          echo "SIGNING_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"

      - name: Sign
        run: |
          codesign --force --timestamp --options runtime \
            --keychain "${SIGNING_KEYCHAIN}" \
            --sign "${SIGNING_IDENTITY}" \
            "dist/${BIN}"
          codesign --verify --strict --verbose=2 "dist/${BIN}"
          codesign --display --verbose=2 "dist/${BIN}"

      # A bare Mach-O cannot carry a stapled ticket, so Gatekeeper checks the
      # notarization online. Notarytool takes a zip, which is also what ships.
      - name: Notarize
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key_file="${RUNNER_TEMP}/AuthKey.p8"
          # Accept the .p8 contents either as raw PEM or base64-encoded.
          if printf '%s' "${APPLE_NOTARY_KEY}" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "${APPLE_NOTARY_KEY}" > "${key_file}"
          else
            printf '%s' "${APPLE_NOTARY_KEY}" | base64 --decode > "${key_file}"
          fi

          name="${BIN}-${GITHUB_REF_NAME}-macos-universal"
          mkdir -p "stage/${name}"
          cp "dist/${BIN}" LICENSE README.md "stage/${name}/"
          ditto -c -k --keepParent "stage/${name}" "dist/${name}.zip"

          submission="$(xcrun notarytool submit "dist/${name}.zip" \
            --key "${key_file}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait --output-format json)"
          echo "${submission}"
          id="$(printf '%s' "${submission}" | /usr/bin/plutil -extract id raw -o - -)"
          status="$(printf '%s' "${submission}" | /usr/bin/plutil -extract status raw -o - -)"

          if [ "${status}" != "Accepted" ]; then
            xcrun notarytool log "${id}" \
              --key "${key_file}" \
              --key-id "${APPLE_NOTARY_KEY_ID}" \
              --issuer "${APPLE_NOTARY_ISSUER_ID}" || true
            echo "::error::Notarization finished with status ${status}"
            exit 1
          fi
          rm -f "${key_file}"

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            ${prerelease}
